name: BeReal493 native build
on:
  workflow_dispatch:
    inputs:
      source_ipa_url:
        description: Temporary download URL of the user-supplied IPA
        required: false
        type: string
  push:
    paths:
      - 'Tweak.m'
      - 'CameraRollAdapter.m'
      - 'BRPairState.*'
      - 'BRBundleIdentity.h'
      - 'BRFrontOrientation.h'
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/build-tweak.yml'
permissions:
  contents: read
jobs:
  tweak:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install confirmation-code transport dependency
        run: python3 -m pip install --disable-pip-version-check -r scripts/requirements-auth-tools.txt
      - name: Run source and IPA-inspector tests
        run: python3 -m unittest discover -s tests -v
      - name: Build native library and analyze supplied IPA
        run: bash scripts/ci-native.sh
      - uses: actions/upload-artifact@v4
        with:
          name: BeReal493-native-${{ github.sha }}
          path: output/
          if-no-files-found: error
          retention-days: 1
